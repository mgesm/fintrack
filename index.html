-radius:24px;padding:16px}.asset-sheet-chart svg{width:100%;height:150px}.asset-range{display:flex;justify-content:space-between;gap:4px;margin:0 2px 18px}.asset-range button{border:0;background:transparent;color:var(--text3);border-radius:10px;padding:6px 8px;font:600 12px var(--font)}.asset-range button.active{background:var(--bg3);color:var(--text)}.asset-data{display:grid;grid-template-columns:1fr 1fr;gap:8px}.asset-data div{padding:13px;background:var(--bg2);border-radius:18px}.asset-data small{display:block;color:var(--text3);font-size:12px}.asset-data strong{font-size:15px;margin-top:4px;display:block}.asset-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.asset-actions button{border:0;border-radius:18px;padding:14px;font:700 16px var(--font)}.asset-actions .buy{background:var(--accent);color:white}.asset-actions .sell{background:var(--bg3);color:var(--red)}

.scard.t-exp{background:linear-gradient(160deg,rgba(255,59,48,0.15),var(--bg2) 62%);}

/* DONUT */

}

.balance-adjustment-note{width:100%;text-align:center;margin:8px 0 0;font-size:12px;font-weight:600;min-height:16px;}

/* DONUT ⇄ HEATMAP FLIP */
.flip-card{margin:4px 16px 0;perspective:1600px;}
.dt-flip-wrap{perspective:1600px;width:100%;max-width:430px;margin:0 auto;}
.dt-flip-wrap .flip-face{cursor:pointer;}
/* Desktop: stack both faces in the same grid cell so the card sizes to the
   taller face (heatmap) — no absolute overflow, no layout jump on flip. */
.dt-flip-wrap .flip-inner{display:grid;height:auto!important;}
.dt-flip-wrap .flip-face{grid-area:1/1;}
.dt-flip-wrap .flip-front{position:relative;justify-content:center;}
.dt-flip-wrap .flip-back{position:relative;transform:rotateY(180deg);justify-content:flex-start;}
.flip-inner{position:relative;transition:transform .62s cubic-bezier(.45,.05,.2,1),height .3s ease;transform-style:preserve-3d;}
.flip-inner.flipped{transform:rotateY(180deg);}
.flip-face{margin:0;width:100%;-webkit-backface-visibility:hidden;backface-visibility:hidden;cursor:pointer;}
.flip-front{position:relative;}
.flip-back{position:absolute;top:0;left:0;width:100%;transform:rotateY(180deg);justify-content:flex-start;}
.donut-container{cursor:default;}
/* CATEGORY ⇄ MONTHLY CHART FLIP */
.cat-flip-card{margin:0 0 8px 0;}
.cat-arch-card{margin:0 0 8px 0;}

.cat-flip-card .cat-row.flip-front{margin-bottom:0;}
.cat-flip-card .flip-back{padding:14px 14px;box-sizing:border-box;position:absolute!important;top:0;left:0;}
.cat-drag-handle{cursor:grab;padding:10px;color:var(--text3);touch-action:none;flex-shrink:0;font-size:16px;line-height:1;user-select:none;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;}
.cat-flip-card.cat-dragging{opacity:0.9;box-shadow:0 10px 26px rgba(0,0,0,0.22);z-index:60;position:relative;}
.cat-flip-card.cat-dragging .flip-inner{pointer-events:none;}
.heatmap-head{width:100%;display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 12px;}
.heatmap-title{font-size:13px;font-weight:700;color:var(--text);}
.heatmap-tot{font-size:12px;font-weight:600;color:var(--text3);}
.heatmap-dow{width:100%;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;}
.heatmap-dow span{text-align:center;font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;}
.heatmap-grid{width:100%;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.hm-cell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;transition:transform .12s;}
.hm-cell:active{transform:scale(0.9);}
.hm-cell.empty{background:transparent;cursor:default;}
.hm-cell.zero{background:var(--bg4);}
.hm-cell.sel{outline:2px solid var(--accent);outline-offset:1px;}
.hm-cell .hmd{font-size:11px;font-weight:700;}
.hm-cell .hma{font-size:8px;font-weight:600;opacity:.85;}
.heatmap-detail{width:100%;margin-top:12px;min-height:20px;}
.hm-det-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.hm-det-day{font-size:13px;font-weight:700;color:var(--text);text-transform:capitalize;}
.hm-det-tot{font-size:13px;font-weight:700;color:var(--red);}
.hm-det-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--card-border);font-size:12px;}
.hm-det-row .d{width:8px;height:8px;border-radius:3px;flex-shrink:0;}
.hm-det-row .n{flex:1;text-transform:capitalize;color:var(--text);}

.hm-det-empty{font-size:12px;color:var(--text3);text-align:center;padding:6px 0;}

/* SMALL ANIMATIONS — app-wide micro-interactions */
@keyframes ftFadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes ftPop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}

.summary .scard:nth-child(2){animation-delay:.05s;} .summary .scard:nth-child(3){animation-delay:.1s;}

.filter-chip,.nav-btn,.sort-select,.btn-save,.btn-cancel,.auth-btn,.settings-btn,.home-annual-toggle{transition:transform .12s ease,background .2s ease,color .2s ease,box-shadow .2s ease;}
.filter-chip:active,.nav-btn:active,.btn-save:active,.btn-cancel:active,.auth-btn:active,.settings-btn:active,.home-annual-toggle:active,.bnav-btn:active{transform:scale(.93);}
.fab{transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease;}

.scard,.cat-row,.acc-card{transition:transform .15s ease,box-shadow .2s ease;}
@media(hover:hover){.scard:hover,.cat-row:hover{transform:translateY(-2px);} .filter-chip:hover{background:var(--bg3);}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;}}

/* LIQUID GLASS BOTTOM NAV — iOS 26 */
.bottom-nav{
  position:fixed;
  bottom:calc(12px + var(--safe-bottom));
  left:50%;transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:406px;
  background:var(--nav-glass);
  -webkit-backdrop-filter:blur(18px) saturate(200%) brightness(1.06);
  backdrop-filter:blur(18px) saturate(200%) brightness(1.06);
  border-radius:999px;
  border:none;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.4) inset,
    0 -2px 6px rgba(255,255,255,0.08) inset,
    0 16px 40px rgba(0,0,0,0.2),
    0 4px 10px rgba(0,0,0,0.1);
  display:flex;
  z-index:60;
  padding:5px;
  gap:2px;
  overflow:hidden;
  isolation:isolate;
  transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);
}
/* Wet-glass refractive rim — uneven light around the whole edge (liquid glass) */
.bottom-nav::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:conic-gradient(from 120deg,
    rgba(255,255,255,0.45),rgba(255,255,255,0.06) 25%,
    rgba(255,255,255,0.3) 50%,rgba(255,255,255,0.03) 70%,rgba(255,255,255,0.4));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;z-index:3;
}
/* Top-left light bloom — the specular catch of a glass slab */
.bottom-nav::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(120% 140% at 28% -10%,rgba(255,255,255,0.16),transparent 45%);
  pointer-events:none;z-index:0;
}
/* Sliding active pill — clear glass capsule (iOS 26 style) */
.bnav-pill{
  position:absolute;
  top:5px;bottom:5px;
  border-radius:999px;
  background:rgba(255,255,255,0.16);
  border:0.5px solid rgba(255,255,255,0.38);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.45) inset,
    0 -1px 3px rgba(0,0,0,0.06) inset,
    0 5px 14px rgba(0,0,0,0.12);
  transition:left 0.42s cubic-bezier(0.34,1.3,0.64,1),width 0.42s cubic-bezier(0.34,1.3,0.64,1);
  pointer-events:none;
  z-index:0;
  -webkit-backdrop-filter:blur(10px) saturate(180%);
  backdrop-filter:blur(10px) saturate(180%);
}
.bnav-btn{
  flex:1;
  padding:5px 6px 4px;
  background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  -webkit-tap-highlight-color:transparent;
  position:relative;z-index:1;
  min-width:0;
  border-radius:0;
  transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
}
.bnav-btn:active{transform:scale(0.84);}
.bnav-icon-wrap{
  width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.bnav-btn.active .bnav-icon-wrap{transform:scale(1.1);}
.bnav-icon-wrap svg{width:19px;height:19px;transition:color 0.2s;}
.bnav-label{
  font-size:9.5px;font-weight:600;
  color:var(--text2);
  color:color-mix(in srgb,var(--text) 66%,transparent);
  transition:color 0.2s;letter-spacing:-0.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.bnav-btn.active .bnav-label{color:var(--accent);text-shadow:none;font-weight:700;}
.bnav-btn svg{
  color:var(--text2);
  color:color-mix(in srgb,var(--text) 72%,transparent);
  filter:drop-shadow(0 0.5px 1px rgba(0,0,0,0.12));
}
.bnav-btn.active svg{color:var(--accent);filter:drop-shadow(0 1px 2px rgba(0,0,0,0.18));}

.budget-alert.warn{color:var(--amber);}.budget-alert.over{color:var(--red);}.budget-alert.ok{color:var(--green);}

.subcat-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--separator2);}
.subcat-row:last-child{border-bottom:none;}
.add-cat-form{background:var(--bg2);border-radius:var(--radius-sm);padding:14px;margin-top:6px;box-shadow:var(--shadow-sm);border:1px solid var(--card-border);}
.form-row{display:flex;gap:8px;align-items:center;}
.add-input{flex:1;background:var(--bg3);border:none;color:var(--text);border-radius:14px;padding:10px 13px;font-size:15px;font-family:var(--font);outline:none;transition:box-shadow 0.2s;}
.add-input:focus{box-shadow:0 0 0 3px rgba(52,199,89,0.2);}
.add-input::placeholder{color:var(--text4);}
.add-btn{background:var(--accent-grad);border:none;color:#fff;border-radius:16px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity 0.15s;}
.add-btn:active{opacity:0.8;}
.arch-btn-sm{background:none;border:none;cursor:pointer;color:var(--text3);font-size:13px;padding:0 3px;transition:color 0.15s;border-radius:4px;}
.arch-btn-sm:hover{color:var(--amber);}
.del-btn-sm{background:none;border:none;cursor:pointer;color:var(--text4);font-size:14px;padding:3px 6px;border-radius:6px;transition:all 0.15s;margin-left:auto;}
.del-btn-sm:hover{color:var(--red);background:rgba(255,59,48,0.08);}
.add-sub-btn{font-size:12px;font-weight:500;color:var(--text3);background:var(--bg3);border:none;border-radius:99px;padding:5px 12px;cursor:pointer;transition:all 0.15s;}
.add-sub-btn:hover{color:var(--text);background:var(--bg4);}
.budget-icon-btn{height:30px;padding:5px 10px!important;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1;color:#D4920F;background:rgba(212,146,15,0.10);border:1px solid rgba(212,146,15,0.42);}
.budget-icon-btn .budget-icon-svg{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:currentColor;}
.budget-icon-btn .budget-icon-svg svg{width:16px;height:16px;display:block;}
.budget-icon-btn .budget-badge{min-width:0;height:auto;padding:0;background:none;color:currentColor;font-family:var(--mono);font-size:10px;font-weight:700;line-height:1;white-space:nowrap;}
.budget-input-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.settings-section .budget-input-row{padding:0 16px 14px;margin-top:0;}
.settings-section .theme-switch-row{margin:0 16px 14px;}
.settings-section textarea{display:block;width:calc(100% - 32px);margin:0 16px 12px;box-sizing:border-box;}
.budget-input{background:var(--bg3);border:none;color:var(--text);border-radius:14px;padding:8px 12px;font-size:14px;font-family:var(--mono);width:115px;text-align:right;outline:none;transition:box-shadow 0.2s;}
.budget-input:focus{box-shadow:0 0 0 3px rgba(255,149,0,0.2);}
.budget-save-btn{font-size:13px;font-weight:600;color:var(--amber);background:rgba(255,149,0,0.1);border:none;border-radius:99px;padding:6px 14px;cursor:pointer;}

/* PATRIMONY */
.pat-total-card{background:var(--bg2);border-radius:var(--radius);padding:20px 18px;margin-bottom:10px;box-shadow:var(--shadow-sm);border:1px solid var(--card-border);}
.pat-total-label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;}
.pat-total-value{font-family:var(--mono);font-size:38px;font-weight:800;background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1.2px;}
/* one cohesive floating pill per account: row + calc + adjust form + history */
.pat-account{background:var(--bg2);border-radius:var(--radius-sm);margin-bottom:10px;box-shadow:var(--shadow-sm);border:1px solid var(--card-border);overflow:hidden;}
.pat-account-row{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;}
.pat-acc-calc{font-size:11px;color:var(--text3);padding:0 16px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pat-adjust-btn{font-size:11px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.pat-adjust-form{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap;}
.pat-adjust-form .add-input{flex:1;min-width:120px;}
.pat-adjust-form .add-btn{flex-shrink:0;}
.pat-hist-table{padding:0 16px 14px;font-family:var(--mono);font-size:11px;}
.pat-hist-lock{color:var(--text3);justify-self:end;display:flex;align-items:center;}
.pat-hist-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 18px;gap:4px;align-items:center;padding:5px 0;border-bottom:0.5px solid var(--separator2);}
.pat-hist-row:last-child{border-bottom:none;}
.pat-hist-head{color:var(--text3);font-weight:600;border-bottom:0.5px solid var(--separator);}
.pat-hist-del{background:none;border:none;color:var(--text3);font-family:var(--mono);font-size:13px;cursor:pointer;padding:0;line-height:1;justify-self:end;}
.pat-hist-del:hover{color:var(--red);}
.pat-acc-color{width:12px;height:12px;border-radius:4px;flex-shrink:0;}
.pat-acc-name{flex:1;font-size:15px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pat-acc-default-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--accent);background:rgba(52,199,89,0.14);padding:2px 7px;border-radius:99px;}
.pat-acc-star{background:none;border:none;cursor:pointer;font-size:18px;line-height:1;color:var(--text4);padding:2px 4px;-webkit-tap-highlight-color:transparent;flex-shrink:0;}
.pat-acc-star.on{color:var(--amber);}
.pat-acc-input{background:var(--bg3);border:none;color:var(--text);border-radius:14px;padding:8px 12px;font-size:15px;font-family:var(--mono);font-weight:600;width:130px;text-align:right;outline:none;transition:box-shadow 0.2s;}
.pat-acc-input:focus{box-shadow:0 0 0 3px rgba(52,199,89,0.2);}
.pat-acc-theoretical{font-size:15px;font-family:var(--mono);font-weight:700;color:var(--text);}
.pat-save-btn{background:var(--accent-grad);border:none;color:#fff;border-radius:20px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:8px;transition:opacity 0.15s;box-shadow:0 8px 22px rgba(52,199,89,0.35);}
.pat-save-btn:active{opacity:0.85;}
.pat-acc-actions{display:flex;gap:8px;padding:0 16px 14px;}
.pat-acc-btn{flex:1;padding:9px 0;border-radius:13px;border:1px solid var(--card-border);background:var(--bg3);color:var(--text2);font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity 0.15s;}
.pat-acc-btn:active{opacity:0.7;}
.pat-acc-btn-primary{background:var(--accent);color:#fff;border:none;}
.pat-acc-hist-hint{font-size:11px;color:var(--text3);padding:0 16px 14px;}
.pat-account.expanded .pat-acc-hist-hint{color:var(--accent);}

/* CHARTS */
.chart-card{background:var(--bg2);border-radius:var(--radius);padding:18px 16px;margin-bottom:10px;box-shadow:var(--glass-inner),var(--shadow);border:1px solid var(--card-border);-webkit-backdrop-filter:blur(44px) saturate(190%);backdrop-filter:blur(44px) saturate(190%);}
.chart-card-title{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:14px;}
.chart-card canvas{display:block;width:100%;}
.chart-legend{display:flex;flex-wrap:wrap;gap:7px 16px;justify-content:center;margin-top:14px;}
.chart-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text2);}
.chart-legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.chart-year-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 0 4px;}
.chart-year-label{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-0.3px;}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.compare-card{background:var(--bg2);border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--glass-inner),var(--shadow-sm);border:1px solid var(--card-border);}
.compare-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:5px;}
.compare-val{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-0.5px;}
.compare-diff{font-size:12px;font-weight:500;margin-top:3px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--bg2);border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--glass-inner),var(--shadow-sm);border:1px solid var(--card-border);display:flex;flex-direction:column;gap:2px;}
.stat-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;}
.stat-val{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:-0.5px;margin-top:4px;}
.stat-sub{font-size:12px;font-weight:500;color:var(--text2);margin-top:2px;}
.stat-card.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;}
.stat-card.wide .stat-val{font-size:20px;margin-top:0;}
.stat-title{font-size:11px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin:4px 0 8px;}

/* AUDIT */
.audit-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--separator2);}
.audit-item:last-child{border-bottom:none;}
.audit-icon{font-size:15px;flex-shrink:0;margin-top:1px;}
.audit-detail{flex:1;font-size:13px;color:var(--text2);line-height:1.4;}
.audit-time{font-size:11px;color:var(--text3);flex-shrink:0;font-weight:500;}

.tx-actions{display:none;align-items:center;gap:4px;margin-left:6px;}
.tx-item:hover .tx-actions{display:flex;}
.tx-btn.del{background:rgba(255,59,48,0.12);border:none;color:var(--red);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:background 0.15s;}
.tx-btn.del:hover{background:rgba(255,59,48,0.25);}
.tx-hl{background:rgba(255,204,0,0.35);color:inherit;border-radius:3px;padding:0 1px;}
@media(prefers-color-scheme:dark){.tx-actions{display:none;align-items:center;gap:4px;margin-left:6px;}
.tx-item:hover .tx-actions{display:flex;}
.tx-btn.del{background:rgba(255,59,48,0.12);border:none;color:var(--red);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:background 0.15s;}
.tx-btn.del:hover{background:rgba(255,59,48,0.25);}
.tx-hl{background:rgba(255,204,0,0.25);}}
.hm-det-row-btn{cursor:pointer;transition:background 0.15s;border-radius:10px;padding:6px 8px;margin:0 -8px;}
.hm-det-row-btn:hover{background:var(--bg4);}
.hm-det-row-btn:active{background:var(--bg3);}
.hm-edit-icon{font-size:15px;color:var(--text3);margin-left:4px;flex-shrink:0;}
/* COLOR PALETTE */
.color-palette{
  display:flex;flex-wrap:nowrap;gap:12px;margin-top:12px;
  overflow-x:auto;padding:10px 22px 14px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.color-palette::-webkit-scrollbar{display:none;}
.color-swatch{
  width:38px;height:38px;border-radius:50%;cursor:pointer;
  border:3px solid transparent;flex-shrink:0;
  transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1),box-shadow 0.2s;
  -webkit-tap-highlight-color:transparent;
}
.color-swatch:active{transform:scale(0.9);}
.color-swatch.active{transform:scale(1.18);box-shadow:0 0 0 3px var(--bg2),0 0 0 5.5px currentColor;}
.cat-color-palette{display:flex;flex-wrap:wrap;gap:8px;}
.cat-color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:transform 0.15s;-webkit-tap-highlight-color:transparent;}
.cat-color-swatch:active{transform:scale(0.88);}
.cat-color-swatch.active{box-shadow:0 0 0 2px var(--bg2),0 0 0 4px currentColor;}
.theme-switch-row{display:flex;gap:8px;background:var(--bg3);border-radius:18px;padding:4px;}
.theme-switch-btn{flex:1;border:none;background:none;color:var(--text3);font-family:var(--font);font-size:13px;font-weight:600;padding:9px 6px;border-radius:14px;cursor:pointer;transition:all 0.18s;-webkit-tap-highlight-color:transparent;}
.theme-switch-btn.active{background:var(--bg2);color:var(--text);box-shadow:var(--shadow-sm);}

/* SETTINGS */
.settings-section{background:var(--bg2);border-radius:var(--radius);padding:0;margin-bottom:10px;box-shadow:var(--shadow-sm);overflow:hidden;border:1px solid var(--card-border);}
.settings-title{font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;padding:14px 16px 8px;}
.settings-info{font-size:14px;color:var(--text2);line-height:1.6;padding:0 16px 8px;}
.settings-btn{display:flex;align-items:center;gap:10px;background:none;border:none;border-top:0.5px solid var(--separator2);color:var(--text);padding:13px 16px;font-size:15px;cursor:pointer;font-family:var(--font);font-weight:400;transition:background 0.15s;width:100%;text-align:left;-webkit-tap-highlight-color:transparent;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.settings-btn:first-of-type{border-top:none;}
.settings-btn:hover{background:var(--bg3);}
.settings-btn:active{background:var(--bg4);}
.settings-btn.danger{color:var(--red);}
.settings-btn .btn-arrow{margin-left:auto;color:var(--text4);font-size:13px;}
.status-msg{font-size:13px;font-weight:500;padding:8px 16px;}
.status-ok{color:var(--green);}.status-err{color:var(--red);}

/* FAB */
.fab{position:fixed;bottom:calc(108px + var(--safe-bottom));right:50%;transform:translateX(50%);background:var(--accent-grad);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:50%;width:60px;height:60px;font-size:28px;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:100;transition:transform 0.2s,opacity 0.15s;box-shadow:0 1px 0 rgba(255,255,255,0.35) inset,0 10px 28px rgba(52,199,89,0.5);}
.fab:active{transform:translateX(50%) scale(0.94);}
.fab.open{transform:translateX(50%) rotate(45deg);}
.fab-hidden{display:none!important;}

/* UNDO TOAST */
.undo-toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:var(--bg2);color:var(--text);border:1px solid var(--card-border);border-radius:99px;padding:10px 8px 10px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;font-size:14px;font-weight:500;z-index:400;opacity:0;pointer-events:none;transition:opacity 0.25s,transform 0.25s;-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);max-width:90vw;white-space:nowrap;}
.undo-toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.undo-toast-btn{background:var(--accent);color:#fff;border:none;border-radius:99px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);white-space:nowrap;-webkit-tap-highlight-color:transparent;}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.45);-webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.modal-bg.visible{opacity:1;pointer-events:all;}
.modal{background:var(--bg2);border:1px solid var(--card-border);border-radius:34px 34px 0 0;width:100%;max-width:430px;padding:8px 20px calc(32px + var(--safe-bottom));transform:translateY(16px);transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);max-height:94dvh;overflow-y:auto;overflow-x:hidden;box-shadow:0 -20px 60px rgba(0,0,0,0.18);touch-action:pan-y;}
.field-input[type="date"]{width:100%;min-width:0;max-width:100%;display:block;box-sizing:border-box;-webkit-appearance:none;appearance:none;}
.modal-bg.visible .modal{transform:translateY(0);}
.modal-handle{width:36px;height:4px;background:var(--bg4);border-radius:99px;margin:12px auto 18px;}
.modal-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:16px;letter-spacing:-0.3px;}
.type-toggle{display:flex;gap:4px;margin-bottom:16px;background:var(--bg3);border-radius:18px;padding:3px;}
.type-btn{flex:1;padding:9px;border-radius:12px;border:none;background:none;color:var(--text3);cursor:pointer;font-size:14px;font-weight:600;font-family:var(--font);text-align:center;transition:all 0.2s;}
.type-btn.active-exp{background:var(--bg2);color:var(--red);box-shadow:0 1px 4px rgba(0,0,0,0.1);}
.type-btn.active-inc{background:var(--bg2);color:var(--green);box-shadow:0 1px 4px rgba(0,0,0,0.1);}
.type-btn.active-tra{background:var(--bg2);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,0.1);}
.field-label{font-size:13px;font-weight:600;color:var(--text3);margin:14px 0 6px;letter-spacing:-0.1px;}
.field-input{width:100%;background:var(--bg3);border:1px solid var(--card-border);color:var(--text);border-radius:18px;padding:12px 14px;font-size:16px;font-family:var(--font);outline:none;transition:box-shadow 0.2s;}
.field-input:focus{box-shadow:0 0 0 3px rgba(52,199,89,0.25);}
.field-input::placeholder{color:var(--text4);}
select.field-input{appearance:none;-webkit-appearance:none;}
select.field-input option{background:var(--bg2);}
.tags-input-wrap{display:flex;flex-wrap:wrap;gap:6px;background:var(--bg3);border-radius:11px;padding:10px 14px;min-height:44px;cursor:text;transition:box-shadow 0.2s;}
.tags-input-wrap:focus-within{box-shadow:0 0 0 3px rgba(52,199,89,0.25);}
.tag-chip{display:flex;align-items:center;gap:4px;background:rgba(52,199,89,0.15);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:500;color:var(--green);}
.tag-chip button{background:none;border:none;cursor:pointer;color:rgba(52,199,89,0.6);font-size:13px;padding:0;line-height:1;}
.tags-text-input{background:none;border:none;outline:none;color:var(--text);font-size:15px;font-family:var(--font);min-width:80px;flex:1;}
.tags-text-input::placeholder{color:var(--text4);}
.recurring-toggle{display:flex;align-items:center;gap:12px;background:var(--bg3);border-radius:14px;padding:13px 14px;cursor:pointer;}
.toggle-switch{width:38px;height:22px;background:var(--bg4);border-radius:99px;position:relative;transition:background 0.25s;flex-shrink:0;}
.toggle-switch.on{background:var(--amber);}
.toggle-knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:white;transition:left 0.25s;box-shadow:0 1px 4px rgba(0,0,0,0.2);}
.toggle-switch.on .toggle-knob{left:18px;}
.modal-btns{display:flex;gap:10px;margin-top:20px;}
.btn-cancel{flex:1;padding:13px;border:1px solid var(--card-border);border-radius:20px;background:var(--bg3);cursor:pointer;color:var(--text2);font-size:16px;font-weight:600;font-family:var(--font);}
.btn-save{flex:2;padding:13px;border:none;border-radius:20px;background:var(--accent-grad);color:#fff;cursor:pointer;font-size:16px;font-weight:700;font-family:var(--font);transition:opacity 0.15s;box-shadow:0 8px 22px rgba(52,199,89,0.35);}
.btn-save:active{opacity:0.85;}
.modal-status{font-size:13px;font-weight:500;text-align:center;padding:6px 0;min-height:20px;}
.recurrence-delete-copy{font-size:14px;color:var(--text2);margin:-4px 0 14px;}
.recurrence-delete-options{display:flex;flex-direction:column;gap:9px;}
.recurrence-delete-option{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;padding:14px 15px;border:1px solid var(--card-border);border-radius:18px;background:var(--bg3);color:var(--text);font-family:var(--font);text-align:left;cursor:pointer;transition:transform .15s,background .2s,border-color .2s;}
.recurrence-delete-option span{font-size:15px;font-weight:700;}.recurrence-delete-option small{font-size:12px;line-height:1.35;color:var(--text3);}.recurrence-delete-option:active{transform:scale(.98);}.recurrence-delete-option.danger{border-color:rgba(255,59,48,.25);}.recurrence-delete-option.danger span{color:var(--red);}.recurrence-delete-cancel{width:100%;margin-top:12px;padding:11px;border:0;background:none;color:var(--text3);font:600 14px var(--font);cursor:pointer;}

@media(min-width:430px){
  .fab{right:calc(50% - 215px + 20px);transform:none;}
  .fab.open{transform:rotate(45deg);}
  .fab:active{transform:scale(0.94);}
}

function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function currentMonthRange(){var from=viewYear+'-'+pad(viewMonth+1)+'-01';var to=lastDayOfMonthStr(viewYear,viewMonth+1);return {from:from,to:to,label:capitalize(MONTHS[viewMonth])+' '+viewYear};}
function getExportTx(range){var t=transactions.slice();if(range&&range.from)t=t.filter(function(x){return x.date>=range.from;});if(range&&range.to)t=t.filter(function(x){return x.date<=range.to;});return t;}
function rangeBounds(range){
  if(range&&range.from&&range.to)return {from:range.from,to:range.to};
  var ds=transactions.map(function(t){return t.date;}).filter(Boolean).sort();
  return {from:ds[0]||todayStr(),to:ds[ds.length-1]||todayStr()};
}

function exportDailyBalanceRange(from,to){

var _scriptCache={};
function loadScript(src,ms){
  if(_scriptCache[src])return _scriptCache[src];
  _scriptCache[src]=new Promise(function(resolve,reject){
    var s=document.createElement('script');s.src=src;
    var t=setTimeout(function(){delete _scriptCache[src];reject(new Error('timeout'));},ms||10000);
    s.onload=function(){clearTimeout(t);resolve();};
    s.onerror=function(){clearTimeout(t);delete _scriptCache[src];reject(new Error('load failed'));};
    document.head.appendChild(s);
  });
  return _scriptCache[src];
}
async function runExport(fmt){

function validateImportData(d){
  function isStr(v,max){return typeof v==='string'&&v.length<=(max||500);}
  function isNum(v){return typeof v==='number'&&isFinite(v);}
  function isId(v){return typeof v==='string'&&v.length>=1&&v.length<=100&&/^[A-Za-z0-9_|.-]+$/.test(v);}

    if(c.color!==undefined&&c.color!==null&&(!isStr(c.color,20)||!/^#[0-9a-fA-F]{3,8}$/.test(c.color)))throw new Error('categoría #'+i+': color inválido');
    if(c.subcats!==undefined&&(!Array.isArray(c.subcats)||c.subcats.some(function(s){return !isStr(s,60);})))throw new Error('categoría #'+i+': subcategorías inválidas');
    if(c.position!==undefined&&!isNum(c.position))throw new Error('categoría #'+i+': posición inválida');
    if(c.archived!==undefined&&typeof c.archived!=='boolean')throw new Error('categoría #'+i+': estado archivado inválido');
    if(c.kind!==undefined&&['expense','income'].indexOf(c.kind)===-1)throw new Error('categoría #'+i+': tipo inválido');
  });
  checkDupIds(d.categories,'categoría');
  var validTypes=['expense','income','transfer'];
  var validIntervals=['weekly','biweekly','monthly','yearly'];
  d.transactions.forEach(function(t,i){
    if(!t||!isId(t.id))throw new Error('transacción #'+i+': id inválido');
    if(validTypes.indexOf(t.type)===-1)throw new Error('transacción #'+i+': tipo inválido');
    if(!isNum(t.amount)||t.amount<0)throw new Error('transacción #'+i+': importe inválido');
    if(t.category!=null&&t.category!=='transfer'&&!isId(t.category))throw new Error('transacción #'+i+': categoría inválida');
    if(t.subcategory!=null&&!isStr(t.subcategory,60))throw new Error('transacción #'+i+': subcategoría inválida');
    if(t.note!=null&&!isStr(t.note,1000))throw new Error('transacción #'+i+': nota demasiado larga');
    if(!isDate(t.date))throw new Error('transacción #'+i+': fecha inválida');
    if(t.recur_interval!=null&&validIntervals.indexOf(t.recur_interval)===-1)throw new Error('transacción #'+i+': intervalo de recurrencia inválido');
    if(t.recur_end_date!=null&&!isDate(t.recur_end_date))throw new Error('transacción #'+i+': fecha de fin inválida');
    if(t.recur_series_id!=null&&!isId(t.recur_series_id))throw new Error('transacción #'+i+': id de serie inválido');
    if(t.tags!==undefined&&(!Array.isArray(t.tags)||t.tags.some(function(g){return !isStr(g,40);})))throw new Error('transacción #'+i+': etiquetas inválidas');
    if(t.account_id!=null&&!isId(t.account_id))throw new Error('transacción #'+i+': cuenta inválida');
    if(t.to_account_id!=null&&!isId(t.to_account_id))throw new Error('transacción #'+i+': cuenta destino inválida');
  });
  checkDupIds(d.transactions,'transacción');
  if(d.accounts!==undefined){
    if(!Array.isArray(d.accounts))throw new Error('cuentas: formato inválido');
    d.accounts.forEach(function(a,i){
      if(!a||!isId(a.id))throw new Error('cuenta #'+i+': id inválido');
      if(!isStr(a.name,80)||!a.name)throw new Error('cuenta #'+i+': nombre inválido');
      if(a.color!=null&&!isColor(a.color))throw new Error('cuenta #'+i+': color inválido');
    });
    checkDupIds(d.accounts,'cuenta');
  }
  if(d.patrimony!==undefined){
    if(!Array.isArray(d.patrimony))throw new Error('patrimonio: formato inválido');
    d.patrimony.forEach(function(p,i){
      if(!p||!isId(p.id))throw new Error('patrimonio #'+i+': id inválido');
      if(p.account_id!=null&&!isId(p.account_id))throw new Error('patrimonio #'+i+': cuenta inválida');
      if(!isNum(p.year)||!isNum(p.month)||!isNum(p.amount))throw new Error('patrimonio #'+i+': valores numéricos inválidos');
    });
    checkDupIds(d.patrimony,'patrimonio');
  }
  if(d.budgets!==undefined){
    if(!Array.isArray(d.budgets))throw new Error('presupuestos: formato inválido');
    d.budgets.forEach(function(b,i){
      if(!b||!isId(b.id))throw new Error('presupuesto #'+i+': id inválido');
      if(b.category_id!=null&&!isId(b.category_id))throw new Error('presupuesto #'+i+': categoría inválida');
      if(!isNum(b.amount))throw new Error('presupuesto #'+i+': importe inválido');
      if(b.month_year!=null&&!isStr(b.month_year,10))throw new Error('presupuesto #'+i+': mes inválido');
      if(b.note!=null&&!isStr(b.note,200))throw new Error('presupuesto #'+i+': nota inválida');
    });
    checkDupIds(d.budgets,'presupuesto');
  }
  if(d.recurrenceExclusions!==undefined){
    if(!Array.isArray(d.recurrenceExclusions))throw new Error('exclusiones de recurrencia: formato invÃ¡lido');
    d.recurrenceExclusions.forEach(function(x,i){
      if(!x||!isId(x.id))throw new Error('exclusiÃ³n #'+i+': id invÃ¡lido');
      if(!isStr(x.recur_series_id,160))throw new Error('exclusiÃ³n #'+i+': serie invÃ¡lida');
      if(!isStr(x.skipped_date,10)||!/^\d{4}-\d{2}-\d{2}$/.test(x.skipped_date))throw new Error('exclusiÃ³n #'+i+': fecha invÃ¡lida');
    });
    checkDupIds(d.recurrenceExclusions,'exclusiÃ³n');
  }
  if(d.transactionVoids!==undefined){
    if(!Array.isArray(d.transactionVoids))throw new Error('anulaciones: formato inválido');
    d.transactionVoids.forEach(function(v,i){if(!v||!isId(v.id)||!isId(v.transaction_id)||!v.transaction_data||typeof v.transaction_data!=='object'||!isStr(v.voided_at,40))throw new Error('anulación #'+i+': datos inválidos');});
    checkDupIds(d.transactionVoids,'anulación');
  }
}

      r2.getCell(4).style=dataStyle(bg,C.red,'right',moneyFmt,true);r2.getCell(4).numFmt=moneyFmt;
      var balFg=bal>=0?C.green:C.red;
      r2.getCell(5).style=dataStyle(bg,balFg,'right',moneyFmtRed,true);r2.getCell(5).numFmt=moneyFmtRed;
      for(var ci=0;ci<categories.length;ci++){
        r2.getCell(6+ci).style=dataStyle(bg,C.text2,'right',moneyFmt);r2.getCell(6+ci).numFmt=moneyFmt;
      }
    }
  });

  // ── SHEET 3: PATRIMONIO ───────────────────────────────────────
  if(accounts.length){
    var ws3=wb.addWorksheet('Patrimonio');
    var nColsPat=2+accounts.length+1;
    var ws3Cols=[{width:7},{width:16}];
    accounts.forEach(function(){ws3Cols.push({width:20});});
    ws3Cols.push({width:18});
    ws3.columns=ws3Cols;
    titleRow(ws3,'fintrack — Evolución Patrimonial',nColsPat);
    subtitleRow(ws3,nColsPat);
    ws3.addRow([]);
    var hd3=['Año','Mes'];
    accounts.forEach(function(a){hd3.push(a.name+' (€)');});
    hd3.push('Total (€)');
    var h3=ws3.addRow(hd3);
    h3.height=20;
    h3.eachCell(function(cell){cell.style=hdrStyle(C.dark,C.white,10,true,'center');});
    var patYrs=[...new Set(patrimony.map(function(p){return p.year;}))].sort();
    var prevPYr=null;
    patYrs.forEach(function(yr){
      for(var m=1;m<=12;m++){
        var has=accounts.some(function(a){return patrimony.find(function(p){return p.account_id===a.id&&p.year===yr&&p.month===m;});});
        if(!has)return;
        var row=[yr,MONTHS[m-1]];var tot=0;
        accounts.forEach(function(a){var p=patrimony.find(function(p){return p.account_id===a.id&&p.year===yr&&p.month===m;});var v=p?p.amount:0;row.push(v);tot+=v;});
        row.push(tot);
        var isNew=prevPYr!==yr;prevPYr=yr;
        var bg3=isNew?C.greenLight:C.white;
        var r3=ws3.addRow(row);r3.height=18;
        r3.getCell(1).style=dataStyle(bg3,C.text,'center',null,isNew);
        r3.getCell(2).style=dataStyle(bg3,C.text,'left');
        for(var ai=0;ai<accounts.length;ai++){r3.getCell(3+ai).style=dataStyle(bg3,C.green,'right',moneyFmt);r3.getCell(3+ai).numFmt=moneyFmt;}
        r3.getCell(3+accounts.length).style=dataStyle(bg3,C.blue,'right',moneyFmt,true);r3.getCell(3+accounts.length).numFmt=moneyFmt;
      }
    });
  }

  // ── SHEET 4: CATEGORIAS ───────────────────────────────────────
  var ws4=wb.addWorksheet('Categorías');
  ws4.columns=[{width:24},{width:48},{width:26},{width:14}];
  titleRow(ws4,'fintrack — Categorías y Presupuestos',4);
  subtitleRow(ws4,4);
  ws4.addRow([]);
  var h4=ws4.addRow(['Categoría','Subcategorías','Presupuesto mensual (€)','Color hex']);
  h4.height=20;h4.eachCell(function(cell){cell.style=hdrStyle(C.dark,C.white,10,true,'center');});
  categories.forEach(function(c,i){
    var bg=i%2===0?C.white:C.light;
    var r4=ws4.addRow([c.name,(c.subcats||[]).join(', '),budgetForCat(c.id)||'',c.color]);
    r4.height=18;
    r4.getCell(1).style=dataStyle(bg,C.text,'left',null,true);
    r4.getCell(2).style=dataStyle(bg,C.text2,'left');
    var bud=budgetForCat(c.id);
    r4.getCell(3).style=dataStyle(bg,bud?C.amber:C.text3,'right',bud?moneyFmt:null,!!bud);
    if(bud)r4.getCell(3).numFmt=moneyFmt;
    r4.getCell(4).style=dataStyle(bg,C.text3,'center');
  });

  // ── DOWNLOAD ──────────────────────────────────────────────────
  wb.xlsx.writeBuffer().then(function(buffer){
    var blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='fintrack_'+range.label.replace(/[^0-9a-zA-Z]+/g,'_')+'.xlsx';
    a.click();
  }).catch(function(e){alert('Error al generar Excel: '+e.message);});
}

function dtRender(){
  if(!IS_DESKTOP) return;
  clearBalanceCache();
  // Month labels in sidebar
  var showPeriodControls=activeTab!==3&&activeTab!==5;
  var dtMonthNav=document.querySelector('.dt-month-nav');if(dtMonthNav)dtMonthNav.style.display=showPeriodControls?'flex':'none';
  var ml=document.getElementById('dtMonthLabel');if(ml)ml.textContent=homeAnnualMode?(''+viewYear):(capitalize(MONTHS[viewMonth])+' '+viewYear);
  var dhab=document.getElementById('dtHomeAnnualBtn');if(dhab){dhab.style.display=showPeriodControls?'flex':'none';dhab.classList.toggle('active',homeAnnualMode);}
  // Nav active state
  document.querySelectorAll('.dt-nav-item').forEach(function(btn){
    btn.classList.toggle('active',parseInt(btn.getAttribute('data-tab'))===activeTab);
  });
  // Page title
  var titles=['Inicio','Categorías','Cuentas','Anual','Inversiones','Ajustes'];
  var pt=document.getElementById('dtPageTitle');if(pt)pt.textContent=titles[activeTab]||'';
  // User info
  if(currentUser){
    var em=currentUser.email||'';
    var av=document.getElementById('dtAvatar');if(av)av.textContent=em[0]?em[0].toUpperCase():'?';
    var de=document.getElementById('dtEmail');if(de)de.textContent=activeTab===5?em:maskEmail(em);
  }
  // Compute stats
  var txs=getDashboardTx();
  var exps=txs.filter(function(t){return !t.is_balance_adjustment&&txExpenseImpact(t)>0;});
  var incs=txs.filter(function(t){return txIncomeImpact(t)>0;});
  var tExp=txs.reduce(function(s,t){return s+txExpenseImpact(t);},0);
  var tInc=txs.reduce(function(s,t){return s+txIncomeImpact(t);},0);
  var bal=tInc-tExp;
  var tb=totalBudget();
  // Build by-cat for donut
  var bycat={};
  exps.forEach(function(t){var k=t.is_balance_adjustment?'__balance_adjustment':t.category;bycat[k]=(bycat[k]||0)+txExpenseImpact(t);});
  var legendHtml=Object.entries(bycat).sort(function(a,b){return b[1]-a[1];}).map(function(e){
    var c=e[0]==='__balance_adjustment'?{name:'Actualización de saldo',color:'#FF3B30'}:catById(e[0]);
    return '<div style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)">'
      +'<div style="width:9px;height:9px;border-radius:50%;background:'+c.color+'"></div>'+capEsc(c.name)+'</div>';
  }).join('');
  // Budget bar html
  var budgetHtml='';
  if(tb>0&&!homeAnnualMode){
    var pct=Math.min(Math.round(tExp/tb*100),100);
    var col=tExp/tb*100>=100?'var(--red)':budgetGradientColor(tExp/tb*100);
    budgetHtml='<div class="dt-budget-top">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">'
      +'<span style="font-size:12px;font-weight:600;color:var(--text3)">Presupuesto mensual</span>'
      +'<span style="font-family:var(--mono);font-size:13px;font-weight:700;color:'+col+'">'+fmt(tExp)+' / '+fmt(tb)+'</span></div>'
      +'<div style="height:5px;background:var(--bg4);border-radius:99px"><div style="height:5px;background:'+col+';border-radius:99px;width:'+pct+'%;transition:width 0.4s"></div></div>'
      +'</div>';
  }
  // Only show top bar on tab 0 and 1
  var showTopBar=(activeTab===0||activeTab===1);
  // Render top bar + tab content into dt-main
  var tc=document.getElementById('dtTabContent');
  if(!tc)return;
  // Top bar HTML
  var topBarHtml=showTopBar?'<div class="dt-top-bar">'
    // Summary cards row
    +'<div class="dt-summary-row">'
    +'<div class="dt-scard"><span class="dt-scard-label">Ingresos</span><span class="dt-scard-value" id="dtInc" style="color:var(--green)">'+fmt(tInc)+'</span></div>'
    +'<div class="dt-scard"><span class="dt-scard-label">Gastos</span><span class="dt-scard-value" id="dtExp" style="color:var(--red)">'+fmt(tExp)+'</span></div>'
    +'<div class="dt-scard"><span class="dt-scard-label">Balance</span><span class="dt-scard-value" id="dtBal" style="color:'+(bal>=0?'var(--green)':'var(--red)')+'">'+fmt(Math.abs(bal))+'</span></div>'
    +'</div>'
    // Donut (flips to heatmap) centered + legend below
    +'<div class="dt-flip-wrap"><div class="flip-inner" id="dtFlipInner">'
    +'<div class="dt-donut-section flip-face flip-front" onclick="dtOnFrontClick(event)">'
    +'<div id="dtDonutWrap" style="position:relative;width:240px;height:240px;cursor:default;">'
    +'<canvas id="dtDonutCanvas" width="240" height="240"></canvas>'
    +'<div class="dt-donut-center">'
    +'<div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em;" id="dtDcPct">GASTOS</div>'
    +'<div class="dt-dc-amount" style="font-family:var(--mono);font-size:22px;font-weight:700;color:var(--text);letter-spacing:-0.5px;" id="dtDcAmt">'+fmt(tExp)+'</div>'
    +'<div style="font-size:11px;color:var(--text3);max-width:100px;text-align:center;line-height:1.3;" id="dtDcCat"></div>'
    +'</div></div>'
    +'<div class="dt-legend-row">'+legendHtml+'</div><div class="balance-adjustment-note" id="dtBalanceAdjustmentNote"></div>'
    +'</div>'
    +'<div class="dt-donut-section flip-face flip-back" onclick="dtOnBackClick(event)">'
    +'<div class="heatmap-head"><span class="heatmap-title" id="dtHmTitle">Gasto diario</span><span class="heatmap-tot" id="dtHmTot"></span></div>'
    +'<div class="heatmap-dow"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>'
    +'<div class="heatmap-grid" id="dtHeatmapGrid"></div>'
    +'<div class="heatmap-detail" id="dtHeatmapDetail"></div>'
    +'</div>'
    +'</div></div>'
    +'</div>'+budgetHtml:'';
  // Tab content
  // Set top bar first
  tc.innerHTML=topBarHtml+'<div id="dtTabInner"></div>';
  if(showTopBar&&shouldAnimateNumbers()){
    countUp(document.getElementById('dtInc'),tInc,fmt);
    countUp(document.getElementById('dtExp'),tExp,fmt);
    countUp(document.getElementById('dtBal'),Math.abs(bal),fmt);
  }else if(showTopBar){
    var _di=document.getElementById('dtInc'),_de=document.getElementById('dtExp'),_db=document.getElementById('dtBal');
    if(_di)_di.textContent=fmt(tInc);if(_de)_de.textContent=fmt(tExp);if(_db)_db.textContent=fmt(Math.abs(bal));
  }
  // Render tab content into the DOM-attached element
  var tabInner=document.getElementById('dtTabInner');
  if(tabInner){
    if(activeTab===0)renderTxTab(tabInner);
    else if(activeTab===1)renderCatTab(tabInner,'dt');
    else if(activeTab===2)renderPatTab(tabInner);
    else if(activeTab===3)renderAnnualTab(tabInner);
    else if(activeTab===4)renderInvestmentsTab(tabInner);
    else renderSettingsTab(tabInner);
  }
  // Render donut after DOM update (canvas now in DOM)
  if(showTopBar){
    var canvas=document.getElementById('dtDonutCanvas');
    if(canvas)dtRenderDonut(exps,tExp,240);
    renderBalanceAdjustmentNote(txs,'dtBalanceAdjustmentNote');
    renderHeatmap(exps,HM_DESKTOP);
  }
}

function dtRenderDonut(exps,total,size){
  size=size||240;
  var canvas=document.getElementById('dtDonutCanvas'); if(!canvas) return;
  var entries=donutEntries(exps);
  var chartTotal=entries.reduce(function(s,e){return s+e.value;},0);
  function refresh(){
    drawDonut(canvas,entries,chartTotal,size,{activeId:dtActiveCat});
    if(dtActiveCat){var a=entries.filter(function(e){return e.id===dtActiveCat;})[0];
      if(a)dtSetCenter(Math.round(a.value/total*100)+'%',fmt(a.value),capitalize(dtActiveCat==='__balance_adjustment'?'Actualización de saldo':catById(dtActiveCat).name));
      else dtSetCenter('GASTOS',total?fmt(total):'0 €','');}
    else dtSetCenter('GASTOS',total?fmt(total):'0 €','');
  }
  refresh();
  canvas.onmousemove=function(ev){if(dtActiveCat)return;var id=donutHit(canvas,ev,entries,chartTotal,size);if(id){var a=entries.filter(function(e){return e.id===id;})[0];dtSetCenter(Math.round(a.value/chartTotal*100)+'%',fmt(a.value),capitalize(id==='__balance_adjustment'?'Actualización de saldo':catById(id).name));}else dtSetCenter('GASTOS',total?fmt(total):'0 €','');canvas.style.cursor=id?'pointer':'default';};
  canvas.onmouseleave=function(){if(!dtActiveCat)dtSetCenter('GASTOS',total?fmt(total):'0 €','');};
  canvas.onclick=function(ev){var id=donutHit(canvas,ev,entries,chartTotal,size);dtActiveCat=(id&&dtActiveCat===id)?null:(id||null);refresh();};
}
function dtSetCenter(p,a,c){var dp=document.getElementById('dtDcPct');var da=document.getElementById('dtDcAmt');var dc=document.getElementById('dtDcCat');if(dp)dp.textContent=p;if(da){da.textContent=a;fitCenterText(da,168,22);}if(dc)dc.textContent=c;}

function dtSetType(t){
  dtType=t;
  var exp=document.getElementById('dtTypeExp');var inc=document.getElementById('dtTypeInc');
  if(exp)exp.className='dt-type-chip'+(t==='expense'?' active-exp':'');
  if(inc)inc.className='dt-type-chip'+(t==='income'?' active-inc':'');
}

async function dtQuickAdd(){
  var amount=parseFloat(document.getElementById('dtQAmount').value);
  var cat=document.getElementById('dtQCat').value;
  var note=document.getElementById('dtQNote').value.trim()||null;
  var date=document.getElementById('dtQDate').value||new Date().toISOString().split('T')[0];
  var status=document.getElementById('dtQStatus');
  if(!Number.isFinite(amount)||amount<=0){if(status){status.style.color='var(--red)';status.textContent='Introduce un importe válido';}return;}
  if(status){status.textContent='Guardando...';status.style.color='var(--text3)';}
  setSync('syncing');
  var accountId=accounts.length?accounts[0].id:null;
  var tx={id:'tx'+Date.now()+Math.random().toString(36).slice(2,6),type:dtType,amount:amount,category:cat,subcategory:null,note:note,date:date,recurring:false,tags:[],account_id:accountId,to_account_id:null,user_id:currentUser.id};
  if(isOffline){transactions.unshift(tx);queueOp({type:'insert',table:'transactions',data:tx});saveLocalCache();setSync('ok');}
  else{var r=await sb.from('transactions').insert(tx).select();
  if(r.error){setSync('err');if(status){status.textContent='Error';status.style.color='var(--red)';}return;}
  transactions.unshift(r.data[0]||tx);saveLocalCache();setSync('ok');}
  document.getElementById('dtQAmount').value='';
  document.getElementById('dtQNote').value='';
  if(status){status.textContent='✓ Guardado';status.style.color='var(--green)';}
  setTimeout(function(){if(status)status.textContent='';},2000);
  dtRender();
}

  var openBg=document.querySelector('.modal-bg.visible');
  if(e.key==='Tab'&&openBg){
    var focusable=openBg.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])');
    if(focusable.length){var first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}

(function(){
  var modal=document.querySelector('.modal');
  var drag=null;
  modal.addEventListener('touchstart',function(e){
    if(modal.scrollTop>2)return;
    var t=e.touches[0];
    drag={startY:t.clientY,dy:0,active:false};
  },{passive:true});
  modal.addEventListener('touchmove',function(e){
    if(!drag)return;
    var t=e.touches[0];
    var dy=t.clientY-drag.startY;
    if(dy<0){drag=null;return;}
    if(modal.scrollTop>2){drag=null;return;}
    drag.active=true;drag.dy=dy;
    modal.style.transition='none';
    modal.style.transform='translateY('+dy+'px)';
    e.preventDefault();
  },{passive:false});
  modal.addEventListener('touchend',function(){
    if(!drag){return;}
    modal.style.transition='transform 0.3s cubic-bezier(0.32,0.72,0,1)';
    if(drag.active&&drag.dy>90){
      closeModal();
    }
    modal.style.transform='';
    drag=null;
  },{passive:true});
})();

var inPasswordRecovery=false;
sb.auth.onAuthStateChange(function(event,session){
  if(event==='PASSWORD_RECOVERY'){inPasswordRecovery=true;if(session&&session.user)currentUser=session.user;showResetPasswordForm();return;}
  if(event==='TOKEN_REFRESHED'||event==='USER_UPDATED'){if(session&&session.user)currentUser=session.user;return;}
  if(event==='SIGNED_IN'&&inPasswordRecovery){if(session&&session.user)currentUser=session.user;return;}
  inPasswordRecovery=false;
  if(session&&session.user){
    var changedUser=!currentUser||currentUser.id!==session.user.id;
    if(changedUser){loadGeneration++;loadDataInFlight=false;loadDataPromise=null;}
    currentUser=session.user;
    if(event==='INITIAL_SESSION'||event==='SIGNED_IN')showApp();
  }
  else{
    loadGeneration++;loadDataInFlight=false;loadDataPromise=null;
    currentUser=null;transactions=[];categories=[];accounts=[];patrimony=[];budgets=[];recurrenceExclusions=[];transactionVoids=[];showAuth();
  }
});
